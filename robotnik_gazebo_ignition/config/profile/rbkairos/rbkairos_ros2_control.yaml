---
/**:

  robotnik_base_control:
    ros__parameters:
      reference_timeout: 2.0
      front_left_wheel_command_joint_name: $(var frame_prefix)front_left_wheel_joint
      front_right_wheel_command_joint_name: $(var frame_prefix)front_right_wheel_joint
      rear_left_wheel_command_joint_name: $(var frame_prefix)back_left_wheel_joint
      rear_right_wheel_command_joint_name: $(var frame_prefix)back_right_wheel_joint
      kinematics:
        wheels_radius: 0.127
        sum_of_robot_center_projection_on_X_Y_axis: 0.47428
      base_frame_id: $(var frame_prefix)base_footprint
      odom_frame_id: $(var frame_prefix)odom
      tf_frame_prefix_enable: false
      enable_odom_tf: true
      pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
      twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]