# Controller types for gz_ros2_control when base_controller:=upstream.
# Same as robotnik_description's rbkairos_controller_params.yaml except that
# robotnik_base_control is ros2_controllers' mecanum_drive_controller.
/**:
  controller_manager:
    ros__parameters:
      use_sim_time: true
      update_rate: 50
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      robotnik_base_control:
        type: mecanum_drive_controller/MecanumDriveController
      joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController
